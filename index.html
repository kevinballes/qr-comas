<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR en una línea</title>
<style>
:root{--bg:#f5f6f8;--fg:#1b2430;--mut:#667085;--card:#fff;--bd:#d0d5dd;--ok:#12805c;--okbg:#e3f5ee;--ac:#2456d6;--er:#c4321c}
@media (prefers-color-scheme:dark){:root{--bg:#14181f;--fg:#e8ecf2;--mut:#9aa4b2;--card:#1d232d;--bd:#3a4452;--ok:#4fd1a1;--okbg:#14352b;--ac:#7aa2ff;--er:#ff8a73}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:720px;margin:0 auto;padding:24px 16px}
h1{font-size:1.3rem;margin:0 0 4px}
p{color:var(--mut);margin:0 0 20px}
label{display:block;font-size:.85rem;color:var(--mut);margin-bottom:4px}
input{width:100%;font:inherit;font-size:1.15rem;padding:14px;border:2px solid var(--bd);border-radius:8px;background:var(--card);color:var(--fg)}
input:focus{outline:none;border-color:var(--ac)}
.status{margin:12px 0 16px;font-weight:600}
.row{display:flex;gap:12px;flex-wrap:wrap}
button{font:inherit;padding:10px 16px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--fg);cursor:pointer}
button.main{background:var(--ac);color:#fff;border-color:var(--ac)}
button:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.msg{min-height:1.4em;margin-top:10px;font-size:.9rem;color:var(--ok)}
.msg.err{color:var(--er)}
</style>
</head>
<body>
<main>
  <h1>QR en una línea</h1>
  <p>Dispara la pistola sobre cada QR. Las comas se ponen solas y la línea nunca termina en coma.</p>

  <label for="line">Línea de códigos</label>
  <input id="line" autocomplete="off" autocapitalize="off" spellcheck="false" autofocus>

  <div id="status" class="status">Escaneados: 0</div>
  <label style="display:flex;gap:8px;align-items:center;margin-bottom:16px"><input id="dup" type="checkbox" style="width:auto"> Permitir códigos repetidos</label>
  <div class="row">
    <button id="copy" class="main">Copiar línea</button>
    <button id="undo">Borrar último</button>
    <button id="reset">Empezar de nuevo</button>
  </div>
  <div id="msg" class="msg" aria-live="polite"></div>
</main>
<script>
const line = document.getElementById('line'), status = document.getElementById('status'), msg = document.getElementById('msg');
let parts = [];      // lecturas ya confirmadas
let typing = false;  // true mientras entra una lectura nueva

function say(t, err){ msg.textContent = t; msg.className = 'msg' + (err ? ' err' : ''); }

function beep(){
  try {
    const c = new (window.AudioContext || window.webkitAudioContext)(), o = c.createOscillator(), g = c.createGain();
    o.type = 'square'; o.frequency.value = 330; g.gain.value = 0.15;
    o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime + 0.35);
  } catch {}
}

function render(){
  line.value = parts.join(',');   // nunca hay coma final
  typing = false;
  status.textContent = 'Escaneados: ' + parts.length;
}

async function copy(){
  try { await navigator.clipboard.writeText(parts.join(',')); say('Copiado: ' + parts.length + ' códigos'); }
  catch { say('No se pudo copiar solo; pulsa "Copiar línea"', true); }
}

line.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === 'Tab') {
    e.preventDefault();
    if (!typing) return;
    const raw = line.value.slice(parts.join(',').length + (parts.length ? 1 : 0)).trim();
    if (!/^\d+$/.test(raw)) { say('Código no válido (solo números): "' + raw + '"', true); render(); return; }
    const pos = parts.indexOf(raw);
    if (pos !== -1 && !document.getElementById('dup').checked) {
      render(); beep();
      say('REPETIDO: ' + raw + ' ya está en la posición ' + (pos + 1) + '. No se ha añadido.', true);
      return;
    }
    parts.push(raw);
    render();
    copy();
    return;
  }
  // Primera tecla de una lectura nueva: añade la coma antes de los dígitos
  if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !typing) {
    typing = true;
    line.value = parts.join(',') + (parts.length ? ',' : '');
    line.setSelectionRange(line.value.length, line.value.length);
    say('');
  }
});

document.getElementById('copy').onclick = () => { copy(); line.focus(); };
document.getElementById('undo').onclick = () => { parts.pop(); render(); say(''); line.focus(); };
document.getElementById('reset').onclick = () => { parts = []; render(); say(''); line.focus(); };
render();
line.focus();
</script>
</body>
</html>
